name: Daily Pipeline

on:
  schedule:
    # 07:30 UTC = 13:00 IST  (first slot)
    - cron: '30 7 * * *'
    # 13:30 UTC = 19:00 IST  (second slot, skipped if UPLOADS_PER_DAY=1)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      force_slot:
        description: 'Force a pipeline run regardless of kill switch'
        required: false
        default: 'false'

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: "1"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-cjk

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Unpack ENV_FILE if provided
        if: "${{ secrets.ENV_FILE != '' }}"
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Restore state DB
        uses: actions/cache@v4
        with:
          path: agent/state/db.sqlite
          key: sqlite-state-${{ github.run_id }}
          restore-keys: sqlite-state-

      - name: Check kill switch
        if: github.event.inputs.force_slot != 'true'
        env:
          PAUSE_PUBLISHING: ${{ vars.PAUSE_PUBLISHING }}
        run: |
          if [ "$PAUSE_PUBLISHING" = "true" ]; then
            echo "PAUSE_PUBLISHING=true — pipeline halted."
            exit 0
          fi

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          CHANNEL_NICHE: ${{ vars.CHANNEL_NICHE }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          UPLOADS_PER_DAY: ${{ vars.UPLOADS_PER_DAY }}
          PUBLISH_TIMES: ${{ vars.PUBLISH_TIMES }}
          APPROVAL_REQUIRED: ${{ vars.APPROVAL_REQUIRED }}
          PAUSE_PUBLISHING: ${{ vars.PAUSE_PUBLISHING }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m agent.main pipeline

      - name: Save state DB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: agent/state/db.sqlite
          key: sqlite-state-${{ github.run_id }}
