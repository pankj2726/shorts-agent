name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Unit tests, lint, static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Runtime deps the tests import. psycopg is installed because
          # agent.modules.db_pg is imported by preflight, even though no test
          # opens a connection.
          pip install requests tenacity pyyaml "psycopg[binary]>=3.1.0"

      - name: Lint (ruff)
        run: ruff check agent scripts tests --output-format=github

      - name: Unit tests
        run: pytest tests/ -v --tb=short

      - name: Preflight self-check
        # Must succeed with no credentials: preflight reports state, it does not
        # require a working provider to run.
        run: python scripts/preflight.py

      - name: Security scan (bandit)
        # -x excludes tests: fixtures deliberately contain fake credentials.
        run: bandit -r agent scripts -x ./tests -ll -q
