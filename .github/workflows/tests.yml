name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Unit tests, lint, static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Runtime deps the tests import. psycopg is installed because
          # agent.modules.db_pg is imported by preflight, even though no test
          # opens a connection.
          pip install requests tenacity pyyaml "psycopg[binary]>=3.1.0"

      # Two tiers. The repository predates ruff and carries ~169 style findings
      # (unsorted imports, datetime.UTC aliases) in modules this PR does not
      # touch; rewriting them would obscure the diff. So:
      #   tier 1 - critical errors repo-wide, the set that catches real defects
      #            (undefined names, syntax errors, bad comparisons);
      #   tier 2 - the full ruleset on the modules that are expected to be clean.
      - name: Lint — critical errors (repo-wide)
        run: ruff check agent scripts tests --select E9,F63,F7,F82 --output-format=github

      # agent/modules/publish.py is deliberately absent: it carries 7
      # pre-existing findings (unused json/time imports, Optional[...] aliases,
      # a broad except) that predate the approval work. Adding it would fail
      # this step on debt unrelated to this PR.
      - name: Lint — full ruleset (router, state store, approvals, preflight, tests)
        run: |
          ruff check agent/router.py agent/modules/db.py agent/modules/db_pg.py \
                     agent/modules/approvals.py scripts/approve_video.py \
                     scripts/preflight.py tests --output-format=github

      - name: Unit tests
        run: pytest tests/ -v --tb=short

      - name: Preflight self-check
        # Must succeed with no credentials: preflight reports state, it does not
        # require a working provider to run.
        run: python scripts/preflight.py

      # Gate on HIGH severity only. Three medium findings predate this work
      # (requests without timeout in notify.py, urlopen in oauth_setup.py, and a
      # B608 in db_pg whose table name is allow-listed), and failing the build on
      # them would hide real regressions behind known debt. They are still
      # printed, by the non-blocking step below.
      - name: Security scan (bandit, high severity)
        # -x excludes tests: fixtures deliberately contain fake credentials.
        run: bandit -r agent scripts -x ./tests -lll -q

      - name: Security findings report (medium and above, non-blocking)
        if: always()
        continue-on-error: true
        run: bandit -r agent scripts -x ./tests -ll
