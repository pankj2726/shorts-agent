name: Daily Trend Radar Digest

on:
  schedule:
    # 01:30 UTC = 07:00 AM IST daily
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      niche:
        description: 'Target Niche for Trend Radar'
        required: false
        default: 'Technology & Wildlife'

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: "1"

jobs:
  trend_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unpack ENV_FILE if provided
        if: "${{ secrets.ENV_FILE != '' }}"
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Run Trend Radar & Deliver Telegram Digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/run_trend_radar.py --niche "${{ github.event.inputs.niche || 'Technology & Wildlife' }}" --telegram
