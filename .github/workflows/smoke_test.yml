name: Smoke Test (Phase 1)

on:
  workflow_dispatch:
  # Temporary trigger: the sandbox GitHub token cannot call workflow_dispatch
  # (HTTP 403), so a push to the session branch is used to start a run.
  push:
    branches:
      - arena/409e32e7-shorts-agent

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      # Reports secret NAMES and value lengths only — never values.
      # Surfaced as annotations because run-log download is blocked for the
      # automation account used to inspect these runs.
      - name: Diagnose which credentials are configured
        env:
          S_ENV_FILE: ${{ secrets.ENV_FILE }}
          S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          S_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          S_PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          S_PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          S_YT_API_KEY: ${{ secrets.YT_API_KEY }}
          S_YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          S_YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          S_YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          names = [
              "ENV_FILE", "GEMINI_API_KEY", "GROQ_API_KEY", "OPENROUTER_API_KEY",
              "PEXELS_API_KEY", "PIXABAY_API_KEY", "YT_API_KEY", "YT_CHANNEL_ID",
              "YT_CLIENT_ID", "YT_CLIENT_SECRET", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID",
          ]
          report = []
          for n in names:
              v = os.environ.get("S_" + n, "")
              report.append(f"{n}={'EMPTY' if not v else 'set len=%d' % len(v)}")
          msg = " | ".join(report).replace("%", "%25")
          print(f"::notice title=Secret presence::{msg}")

          env_file = os.environ.get("S_ENV_FILE", "")
          if env_file:
              keys, skipped = [], 0
              for line in env_file.replace("\r\n", "\n").splitlines():
                  s = line.strip()
                  if not s or s.startswith("#"):
                      continue
                  if "=" not in s:
                      skipped += 1
                      continue
                  k, v = s.split("=", 1)
                  keys.append(f"{k.strip()}={len(v.strip())}")
              head = f"ENV_FILE lines parsed: {len(keys)} key(s), {skipped} non-KV line(s) -> " + ", ".join(keys[:40])
              print("::notice title=ENV_FILE key names and value lengths::" + head.replace("%", "%25")[:1000])
          else:
              print("::notice title=ENV_FILE::secret ENV_FILE is EMPTY")
          PY

      - name: Check that credentials are configured
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ] && { [ -z "$GEMINI_KEY" ] || [ -z "$YT_KEY" ]; }; then
            echo "::error::No credentials found. Add repository secret ENV_FILE (full .env contents), or GEMINI_API_KEY + YT_API_KEY individually."
            echo "Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo "Credentials present."

      - name: Write ENV_FILE (empty when not configured)
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE_CONTENT" > .env

      - name: Run Phase 1 smoke test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          python scripts/smoke_test.py 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          {
            echo "Smoke test exit code: $code"
            echo '```text'
            cat smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Emit the whole log as annotations so it can be read via the
          # check-runs annotations API. Long token-like strings are redacted.
          python - "$code" <<'PY'
          import re, sys
          code = sys.argv[1]
          try:
              text = open("smoke.log", encoding="utf-8", errors="replace").read()
          except OSError:
              text = "(smoke.log missing)"
          for raw in text.splitlines():
              line = re.sub(r"[A-Za-z0-9_\-]{24,}", "<redacted>", raw)
              line = line.replace("%", "%25").replace("\r", "%0D")
              print(f"::notice title=smoke.log::{line[:480]}")
          level = "error" if code != "0" else "notice"
          print(f"::{level} title=Smoke test result::exit code {code}")
          PY
          exit "$code"
