name: Smoke Test (Phase 1)

on:
  workflow_dispatch:
  # Temporary trigger: the sandbox GitHub token cannot call workflow_dispatch
  # (HTTP 403), so a push to the session branch is used to start a run.
  push:
    branches:
      - arena/409e32e7-shorts-agent

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Check that credentials are configured
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ] && { [ -z "$GEMINI_KEY" ] || [ -z "$YT_KEY" ]; }; then
            echo "::error::No credentials found. Add repository secret ENV_FILE (full .env contents), or GEMINI_API_KEY + YT_API_KEY individually."
            echo "Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo "Credentials present."

      - name: Write ENV_FILE (empty when not configured)
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE_CONTENT" > .env

      - name: Run Phase 1 smoke test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          python scripts/smoke_test.py 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          {
            echo "Smoke test exit code: $code"
            echo '```text'
            cat smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error::$(grep -E '❌|Smoke test FAILED' smoke.log | tr '\n' ' ')"
          fi
          exit "$code"
