name = "shorts-omniroute-edge"
main = "worker.js"
compatibility_date = "2024-11-01"

[placement]
mode = "smart"

# 24/7 Serverless R2 Bucket Binding
# Binds the workspace-cache bucket directly to the edge worker
[[r2_buckets]]
binding = "WORKSPACE_CACHE"
bucket_name = "workspace-cache"

# Environment Variables & Fallback Configurations
[vars]
ENVIRONMENT = "production"
DEFAULT_MODEL = "coding-router-preview"
